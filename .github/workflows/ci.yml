name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gymtracker
          POSTGRES_PASSWORD: gymtracker
          POSTGRES_DB: gymtracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gymtracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://gymtracker:gymtracker@localhost:5432/gymtracker_test
      JWT_SECRET: ci-test-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx tsc --noEmit

      - run: npm test
